    <!-- Hamburger Menu & Responsive 768 (inline) -->
    <style>
        /* Brutalist Avant-garde — 마포 서버 웜업 x 강남 셔츠룸 */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0d0d0d;
            --bg-alt: #111;
            --surface: #1a1a1a;
            --border: #ff0060;
            --text: #e6e6e6;
            --text-dim: #888;
            --accent: #ff0060;
            --accent2: #00f0ff;
            --glow: 0 0 10px rgba(255, 0, 96, 0.6);
            --font-mono: 'Courier New', Courier, monospace;
            --font-sans: 'Arial Black', 'Impact', sans-serif;
            --header-h: 70px;
        }

        html {
            scroll-behavior: smooth;
            background: var(--bg);
        }

        body {
            font-family: var(--font-mono);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ===== header / nav ===== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: var(--header-h);
            background: rgba(13, 13, 13, 0.95);
            backdrop-filter: blur(6px);
            border-bottom: 3px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .logo {
            font-family: var(--font-sans);
            font-size: 1.4rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: var(--glow);
        }
        .logo span {
            color: var(--accent2);
        }

        nav {
            display: flex;
            gap: 28px;
            align-items: center;
        }
        nav a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s;
            position: relative;
        }
        nav a:hover,
        nav a.active {
            color: var(--accent);
        }
        nav a.active::after {
            content: '';
            display: block;
            height: 2px;
            background: var(--accent);
            margin-top: 2px;
            box-shadow: var(--glow);
        }

        /* hamburger menu button — hidden by default */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
        }
        .hamburger span {
            display: block;
            width: 28px;
            height: 3px;
            background: var(--accent);
            border-radius: 0;
            transition: all 0.3s;
        }
        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        /* responsive 768 */
        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }
            nav {
                position: fixed;
                top: var(--header-h);
                left: 0;
                right: 0;
                background: #0d0d0d;
                flex-direction: column;
                gap: 0;
                padding: 20px 0;
                border-bottom: 3px solid var(--border);
                transform: translateY(-120%);
                transition: transform 0.35s ease;
                z-index: 999;
            }
            nav.open {
                transform: translateY(0);
            }
            nav a {
                padding: 14px 24px;
                width: 100%;
                border-bottom: 1px solid #222;
                font-size: 1rem;
            }
            nav a:last-child {
                border-bottom: none;
            }
        }

        /* ===== main ===== */
        main {
            padding-top: var(--header-h);
            max-width: 1200px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 80px;
        }

        section {
            margin: 60px 0;
        }

        h1, h2, h3 {
            font-family: var(--font-sans);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        h1 {
            font-size: 2.8rem;
            color: var(--accent);
            text-shadow: var(--glow);
            line-height: 1.2;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 2rem;
            border-left: 8px solid var(--accent);
            padding-left: 18px;
            margin: 50px 0 30px;
            color: var(--accent2);
        }
        h3 {
            font-size: 1.3rem;
            color: var(--text);
            margin-bottom: 12px;
        }

        p {
            margin-bottom: 1.2rem;
            color: var(--text);
            font-size: 0.95rem;
            max-width: 720px;
        }

        .highlight-box {
            background: var(--surface);
            border: 2px solid var(--border);
            padding: 24px;
            margin: 30px 0;
            box-shadow: var(--glow);
        }

        a {
            color: var(--accent2);
            text-decoration: underline;
            transition: color 0.2s;
        }
        a:hover {
            color: var(--accent);
        }

        /* card grid (재사용) */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin: 30px 0;
        }
        .card {
            background: var(--surface);
            border: 2px solid #333;
            padding: 24px 20px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            border-color: var(--accent);
            box-shadow: var(--glow);
        }
        .card h3 {
            font-size: 1.2rem;
            color: var(--accent);
        }
        .card p {
            font-size: 0.9rem;
            color: var(--text-dim);
        }
        .card .tag {
            display: inline-block;
            background: var(--accent);
            color: #000;
            padding: 2px 10px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        /* FAQ style */
        .faq-item {
            border-bottom: 1px solid #2a2a2a;
            padding: 20px 0;
        }
        .faq-item:last-child {
            border-bottom: none;
        }
        .faq-q {
            font-family: var(--font-sans);
            font-size: 1.1rem;
            color: var(--accent);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        .faq-q::after {
            content: '+';
            font-size: 1.5rem;
            color: var(--accent2);
            transition: transform 0.2s;
        }
        .faq-item.open .faq-q::after {
            content: '–';
        }
        .faq-a {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease, padding 0.2s;
            color: var(--text-dim);
            padding-top: 0;
        }
        .faq-item.open .faq-a {
            max-height: 300px;
            padding-top: 16px;
        }

        /* blog article specific */
        .blog-article {
            background: var(--surface);
            border: 2px solid var(--border);
            padding: 40px 32px;
            margin: 40px 0;
            position: relative;
        }
        .blog-article .meta {
            color: var(--text-dim);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent2);
            padding-left: 12px;
        }
        .blog-article blockquote {
            border-left: 6px solid var(--accent);
            padding-left: 20px;
            margin: 30px 0;
            font-style: italic;
            color: var(--accent2);
            font-size: 1.1rem;
        }

        /* footer */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-dim);
            font-size: 0.75rem;
            border-top: 1px solid #222;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* misc */
        .btn {
            display: inline-block;
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 10px 24px;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            transition: 0.2s;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn:hover {
            background: var(--accent);
            color: #000;
            box-shadow: var(--glow);
        }

        hr {
            border: none;
            height: 2px;
            background: var(--border);
            margin: 50px 0;
            box-shadow: var(--glow);
        }
    </style>

</head>
